name: Deploy Gold Alerts Worker
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Worker JavaScript syntax
        run: node --check --input-type=module < worker/index.js
      - name: Check app scripts and duplicate HTML IDs
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          for (const file of ['index.html', 'gold-chart.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)];
            for (const [i, match] of scripts.entries()) new vm.Script(match[1], { filename: file + ':script-' + i });
            const ids = [...html.matchAll(/\\bid=["']([^"']+)["']/g)].map(x => x[1]);
            const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
            if (duplicates.length) throw new Error(file + ' has duplicate IDs: ' + [...new Set(duplicates)].join(', '));
            console.log(file + ': scripts parse; ' + ids.length + ' unique IDs.');
          }
          NODE
      - name: Validate deployment settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
        run: |
          test -n "$CF_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CF_ACCOUNT" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository variable" && exit 1)
          test -n "$CF_KV_ID" || (echo "Missing CF_KV_NAMESPACE_ID repository variable" && exit 1)
      - run: npm install --global wrangler
      - name: Generate Wrangler config
        env:
          CF_KV_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
        run: |
          cat > worker/wrangler.toml <<EOF
          name = "ngr-gold-alerts"
          main = "index.js"
          compatibility_date = "2025-11-25"
          [triggers]
          crons = ["* * * * *"]
          [[kv_namespaces]]
          binding = "ALERTS_KV"
          id = "$CF_KV_ID"
          EOF
      - name: Deploy
        working-directory: worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test Worker health and configuration
        run: |
          curl --fail --silent --show-error https://ngr-gold-alerts.kumail551255.workers.dev/health > health.json
          node -e 'const h=require("./health.json"); if(h.status!=="online" || !h.kvConfigured || h.monitorIntervalSeconds!==60) { console.error("Worker health check failed", h); process.exit(1); } console.log("Worker health, KV binding and one-minute schedule configuration verified.");'
