<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c12"><title>NGR TRADES PRO · Full-screen Gold Chart</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c12;color:#f3f4f6;font-family:Inter,Roboto,system-ui,sans-serif}
body{display:flex;flex-direction:column}.top{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #2a3140;background:#0b0e14;gap:8px}.brand{font-size:12px;font-weight:800;letter-spacing:1px;color:#D4AF37}.actions{display:flex;gap:8px}.btn{border:1px solid #D4AF37;background:#D4AF37;color:#17140a;border-radius:9px;padding:9px 12px;font-weight:700;font-size:12px;white-space:nowrap}.btn.secondary{background:#151a23;color:#f3f4f6;border-color:#394252}.chart{flex:1;min-height:0;width:100%;background:#090c12}.chart iframe{width:100%;height:100%;border:0}.hint{font-size:11px;color:#9ca3af;padding:7px 12px;background:#0b0e14;text-align:center}
@media (orientation:landscape){.top{height:44px;flex-basis:44px}.hint{display:none}}
:fullscreen .top{display:none}
</style></head><body>
<header class="top"><div class="brand">NGR TRADES PRO · XAU/USD</div><div class="actions"><button class="btn secondary" onclick="goBack()">← Back</button><button class="btn" onclick="enterImmersive()">⛶ Landscape full screen</button></div></header>
<main class="chart" id="chartArea"><iframe title="Full-screen interactive XAUUSD gold chart" allow="fullscreen" allowfullscreen src="https://www.tradingview.com/widgetembed/?symbol=OANDA%3AXAUUSD&interval=60&hidesidetoolbar=0&symboledit=0&theme=dark&style=1&timezone=Etc%2FUTC&withdateranges=1&hideideas=1"></iframe></main>
<div class="hint" id="hint">For the immersive view, tap “Landscape full screen” and rotate your phone sideways if it does not rotate automatically.</div>
<script>
async function enterImmersive(){
 const root=document.documentElement;
 try{if(!document.fullscreenElement&&root.requestFullscreen)await root.requestFullscreen()}catch(e){}
 try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch(e){}
 document.getElementById('hint').textContent='Full-screen chart · Rotate your phone sideways if needed. Use your browser controls to exit.';
}
function goBack(){if(history.length>1)history.back();else location.href='./index.html'}
</script></body></html>
